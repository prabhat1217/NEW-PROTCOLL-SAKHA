name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install PDF libraries
        run: npm install jspdf@2.5.1 html2canvas@1.4.1 --save-exact

      - name: Check PDF libraries
        run: |
          dir node_modules\jspdf\dist
          dir node_modules\html2canvas\dist

      - name: Build Windows EXE
        run: npm run exe

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOLL-SAKHA-Windows-EXE
          path: dist/*
          if-no-files-found: error
