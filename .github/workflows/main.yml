
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build EXE
        run: npm run exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOLL-SAKHA-Windows
          path: dist/*
